<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athletle Archive</title>
<meta name="description" content="Replay every past Athletle puzzle.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="icon" id="backLink" href="./" aria-label="Back to today's game" title="Today's game">←</a>
  <h1><a href="./">ATHLETLE</a></h1>
  <span class="icon" style="visibility:hidden"></span>
</header>
<nav class="mode-bar" id="modeBar" aria-label="Choose a sport"></nav>

<main>
  <h2 class="page-title" id="title">Archive</h2>
  <p class="sub left">Replay any past day. Athletes stay hidden until you've played that day. Replays don't change your streak.</p>
  <ul class="archive-list" id="list"></ul>
</main>

<script src="data/countries.js"></script>
<script src="data/core.js"></script>
<script src="data/soccer.js"></script>
<script src="data/basketball.js"></script>
<script src="data/football.js"></script>
<script src="data/baseball_hockey.js"></script>
<script src="data/individual.js"></script>
<script src="data/combat_cricket_rugby.js"></script>
<script src="data/extra.js"></script>
<script src="data/finalize.js"></script>
<script src="common.js"></script>
<script>
(() => {
  const { MODES, modeFromURL, dayNumber, dateForDay, athleteForDay, load, modeState, avatar, MAX_GUESSES } = Athletle;
  const mode = modeFromURL(), M = MODES[mode];
  const q = (extra) => { const s = new URLSearchParams({ ...(mode !== "all" && { mode }), ...extra }).toString(); return s ? "?" + s : ""; };
  const today = dayNumber();
  const ms = modeState(load(), mode);
  document.title = `Athletle ${mode === "all" ? "" : M.label + " "}Archive`;
  document.getElementById("title").textContent = `${M.icon} ${M.label} archive`;
  document.getElementById("backLink").href = "./" + q({});

  const bar = document.getElementById("modeBar");
  for (const [key, m] of Object.entries(MODES)) {
    const a = document.createElement("a");
    a.className = "mode-chip" + (key === mode ? " current" : "");
    a.href = key === "all" ? "archive.html" : `archive.html?mode=${key}`;
    a.textContent = `${m.icon} ${m.label}`;
    bar.appendChild(a);
  }
  const cur = bar.querySelector(".current");
  if (cur) bar.scrollLeft = cur.offsetLeft - bar.clientWidth / 2 + cur.clientWidth / 2;

  const list = document.getElementById("list");
  const fmt = (n) => dateForDay(n).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  for (let n = today; n >= 0; n--) {
    const game = ms.days[n];
    const athlete = athleteForDay(mode, n);
    const won = game?.done && game.guesses.includes(athlete.name);
    const a = document.createElement("a");
    a.href = n === today ? "./" + q({}) : "./" + q({ day: n });
    a.appendChild(Object.assign(document.createElement("span"), { className: "no", textContent: `#${n + 1}` }));
    a.appendChild(game?.done ? avatar(athlete) : Object.assign(document.createElement("span"), { className: "mystery", textContent: "?" }));
    const info = document.createElement("span");
    info.className = "info";
    info.append(Object.assign(document.createElement("b"), { textContent: game?.done ? `${athlete.name} · ${athlete.sport}` : "Hidden athlete" }),
      Object.assign(document.createElement("small"), { textContent: fmt(n) }));
    a.appendChild(info);
    const pill = document.createElement("span");
    pill.className = "pill";
    if (n === today && !game?.done) { pill.classList.add("today"); pill.textContent = "Today"; }
    else if (won) { pill.classList.add("won"); pill.textContent = `Solved ${game.guesses.length}/${MAX_GUESSES}`; }
    else if (game?.done) { pill.classList.add("lost"); pill.textContent = "Missed"; }
    else if (game?.guesses.length) pill.textContent = "In progress";
    else pill.textContent = "Play";
    a.appendChild(pill);
    const li = document.createElement("li");
    li.appendChild(a);
    list.appendChild(li);
  }
})();
</script>
</body>
</html>
